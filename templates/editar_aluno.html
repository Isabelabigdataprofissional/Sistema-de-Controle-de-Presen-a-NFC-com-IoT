<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Aluno - Sistema de Chamada Escolar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('presenca_page') }}">Chamada</a>
            <a href="{{ url_for('alunos_page') }}">Alunos</a>
            <a href="{{ url_for('historico_page') }}">Histórico</a>
        </nav>

        <h1>Editar Aluno</h1>
        <p class="subtitulo">Atualize os dados do aluno cadastrado por UID NFC.</p>

        <section class="card">
            <form action="{{ url_for('editar_aluno', ra=aluno.ra) }}" method="post">
                <label>RA do Aluno</label>
                <input type="text" value="{{ aluno.ra }}" disabled>
                <label>UID do Cartão</label>
                <input type="text" name="id_nfc" value="{{ aluno.uid }}" required>
                <label>Nome</label>
                <input type="text" name="nome" value="{{ aluno.nome }}" required>
                <button type="submit" class="botao-principal">Salvar alterações</button>
            </form>
        </section>
    </div>
</body>
</html>
