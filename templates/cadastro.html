<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos - Sistema de Chamada Escolar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('presenca_page') }}">Chamada</a>
            <a href="{{ url_for('alunos_page') }}">Alunos</a>
            <a href="{{ url_for('historico_page') }}">Histórico</a>
        </nav>

        <h1>Cadastro de Aluno</h1>
        <p class="subtitulo">Insira o UID NFC e os dados do aluno para habilitar a presença por leitura.</p>

        <section class="card">
            <form action="{{ url_for('cadastrar_aluno') }}" method="post">
                <label>RA do Aluno</label>
                <input type="text" name="id_aluno" placeholder="RA do aluno" required>
                <label>Nome</label>
                <input type="text" name="nome" placeholder="Nome completo" required>
                <label>UID do Cartão</label>
                <input type="text" name="id_nfc" placeholder="UID NFC" required>
                <button type="submit" class="botao-principal">Cadastrar Aluno</button>
            </form>
        </section>
    </div>
</body>
</html>
